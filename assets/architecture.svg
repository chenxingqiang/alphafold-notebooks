  <title>AlphaFold Codec: fine-tuning first architecture</title>
  <rect width="1200" height="980" fill="#ffffff"/>
  <rect x="16" y="16" width="1168" height="948" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Header -->
  <text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0f172a">AlphaFold Codec</text>
  <text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">Fine-tuning first: load official weights, attach LoRA, train a task head, export a small adapter.</text>
  <rect x="920" y="32" width="110" height="24" rx="6" fill="#16a34a"/>
  <text x="934" y="49" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ffffff">50+ tasks</text>
  <rect x="1040" y="32" width="120" height="24" rx="6" fill="#2563eb"/>
  <text x="1052" y="49" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ffffff">AF3 v3.0.4</text>

  <!-- ========== LAYER 1: AF3 WEIGHT PIPELINE ========== -->
  <text x="40" y="112" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#7c3aed">1. ALPHAFOLD 3 WEIGHT PIPELINE (new 2026)</text>

  <rect x="40" y="124" width="200" height="88" rx="10" fill="#7c3aed"/>
  <text x="54" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Download weights</text>
  <text x="54" y="170" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ede9fe">storage.googleapis.com</text>
  <text x="54" y="186" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ede9fe">/alphafold3/af3.bin.zst</text>
  <text x="54" y="202" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ede9fe">non-commercial ToU</text>

  <polygon points="250,168 266,160 266,176" fill="#64748b"/>

