  <text x="526" y="170" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ede9fe">freeze AF3 base</text>
  <text x="526" y="186" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ede9fe">rank=8 on q/k/v/FFN</text>
  <text x="526" y="202" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ede9fe">Pairformer + Diffusion</text>

  <polygon points="722,168 738,160 738,176" fill="#64748b"/>

  <rect x="748" y="124" width="200" height="88" rx="10" fill="#4c1d95"/>
  <text x="762" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Train task head</text>
  <text x="762" y="170" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ede9fe">affinity / antibody</text>
  <text x="762" y="186" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ede9fe">enzyme / PPI / GO</text>
  <text x="762" y="202" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ede9fe">head-only or LoRA</text>

  <polygon points="958,168 974,160 974,176" fill="#64748b"/>

  <rect x="984" y="124" width="180" height="88" rx="10" fill="#16a34a"/>
