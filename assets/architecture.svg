  <text x="998" y="170" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#dcfce7">*.npz LoRA deltas</text>
  <text x="998" y="186" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#dcfce7">no base weights</text>
  <text x="998" y="202" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#dcfce7">save_adapter()</text>

