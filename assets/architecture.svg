<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">AlphaFold Codec Repository Architecture</title>
  <desc id="desc">Layered architecture: model families, learning resources, reference submodules, and fine-tuning framework.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 26px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #475569; }
      .layer-label { font: 600 13px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #334155; letter-spacing: 0.04em; }
      .box-title { font: 700 15px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #ffffff; }
      .box-text { font: 400 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #f8fafc; }
      .box-meta { font: 500 11px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #e2e8f0; }
      .chip { font: 600 11px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
      .footer { font: 400 11px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1120" height="720" fill="url(#bg)"/>
  <rect x="24" y="24" width="1072" height="672" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="56" y="68" class="title">AlphaFold Codec  Repository Architecture</text>
  <text x="56" y="94" class="subtitle">Learn structure-prediction algorithms · map to source code · fine-tune for downstream tasks</text>

  <!-- Layer labels -->
  <text x="56" y="138" class="layer-label">MODEL FAMILIES</text>
  <text x="56" y="318" class="layer-label">LEARNING RESOURCES (per model directory)</text>
  <text x="56" y="498" class="layer-label">SHARED INFRASTRUCTURE</text>
  <text x="56" y="628" class="layer-label">DOWNSTREAM OUTPUTS</text>

  <!-- Model family boxes -->
  <g filter="url(#shadow)">
    <rect x="56" y="152" width="230" height="118" rx="14" fill="#2563eb"/>
    <text x="76" y="182" class="box-title">AlphaFold 2</text>
    <text x="76" y="206" class="box-text">Evoformer + Structure Module</text>
    <text x="76" y="228" class="box-meta">32 algorithms · JAX/Haiku</text>
    <text x="76" y="248" class="box-meta">alphafold2/</text>

    <rect x="306" y="152" width="230" height="118" rx="14" fill="#7c3aed"/>
    <text x="326" y="182" class="box-title">AlphaFold 3</text>
    <text x="326" y="206" class="box-text">Pairformer + Diffusion</text>
    <text x="326" y="228" class="box-meta">23 algorithms · v3.0.4 weights</text>
    <text x="326" y="248" class="box-meta">alphafold3/</text>

    <rect x="556" y="152" width="230" height="118" rx="14" fill="#0d9488"/>
    <text x="576" y="182" class="box-title">Boltz-1</text>
    <text x="576" y="206" class="box-text">Open biomolecular interactions</text>
    <text x="576" y="228" class="box-meta">20 algorithms · PyTorch</text>
    <text x="576" y="248" class="box-meta">boltz/</text>

    <rect x="806" y="152" width="258" height="118" rx="14" fill="#ea580c"/>
    <text x="826" y="182" class="box-title">Boltz-2</text>
    <text x="826" y="206" class="box-text">Structure + binding affinity</text>
    <text x="826" y="228" class="box-meta">10 new algorithms · affinity head</text>
    <text x="826" y="248" class="box-meta">boltz2/</text>
  </g>

  <!-- Learning resource columns -->
  <g filter="url(#shadow)">
    <rect x="56" y="332" width="230" height="132" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="76" y="360" class="chip" fill="#1d4ed8">notebooks/</text>
    <text x="76" y="382" class="footer" fill="#334155">NumPy re-implementations</text>
    <text x="76" y="402" class="footer" fill="#334155">Pseudocode + tests</text>
    <text x="76" y="430" class="chip" fill="#1d4ed8">source/</text>
    <text x="76" y="452" class="footer" fill="#334155">AF2 reference code (JAX)</text>

    <rect x="306" y="332" width="230" height="132" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="326" y="360" class="chip" fill="#6d28d9">notebooks/</text>
    <text x="326" y="382" class="footer" fill="#334155">Diffusion + Pairformer</text>
    <text x="326" y="402" class="footer" fill="#334155">23 algorithm walkthroughs</text>
    <text x="326" y="430" class="chip" fill="#6d28d9">AF3REFPAPERS.md</text>
    <text x="326" y="452" class="footer" fill="#334155">50 curated papers</text>

    <rect x="556" y="332" width="230" height="132" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="576" y="360" class="chip" fill="#0f766e">notebooks/</text>
    <text x="576" y="382" class="footer" fill="#334155">Pairformer + diffusion stack</text>
    <text x="576" y="402" class="footer" fill="#334155">BOLTZREFPAPERS.md</text>
    <text x="576" y="430" class="chip" fill="#0f766e">ref-src/</text>
    <text x="576" y="452" class="footer" fill="#334155">boltz-official submodule</text>

    <rect x="806" y="332" width="258" height="132" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <text x="826" y="360" class="chip" fill="#c2410c">notebooks/</text>
    <text x="826" y="382" class="footer" fill="#334155">Affinity + contact modules</text>
    <text x="826" y="402" class="footer" fill="#334155">BOLTZ2REFPAPERS.md</text>
    <text x="826" y="430" class="chip" fill="#c2410c">ref-src/boltzina</text>
    <text x="826" y="452" class="footer" fill="#334155">virtual screening tools</text>
  </g>

  <!-- Vertical connectors model -> resources -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M171 270 L171 332"/>
    <path d="M421 270 L421 332"/>
    <path d="M671 270 L671 332"/>
    <path d="M935 270 L935 332"/>
  </g>

  <!-- Fine-tuning framework -->
  <g filter="url(#shadow)">
    <rect x="56" y="514" width="1008" height="88" rx="14" fill="#15803d"/>
    <text x="76" y="544" class="box-title">finetuning/  Unified Fine-tuning Framework</text>
    <text x="76" y="568" class="box-text">configs · modules (LoRA / Adapter) · heads (50+ tasks) · trainers · registry</text>
    <text x="76" y="588" class="box-meta">finetuning/af3/  AF3 weight I/O · schema validation · Haiku LoRA · AlphaFold3FineTuner</text>
  </g>

  <!-- Reference submodules bar -->
  <g filter="url(#shadow)">
    <rect x="306" y="474" width="508" height="28" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="320" y="493" class="footer" fill="#475569">git submodules: */ref-src/ (official repos, OpenFold, ColabFold, MMseqs2, &)</text>
  </g>

  <!-- Connectors to finetuning -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M171 464 L171 514"/>
    <path d="M421 464 L421 514"/>
    <path d="M671 464 L671 514"/>
    <path d="M935 464 L935 514"/>
    <path d="M560 602 L560 648"/>
  </g>

  <!-- Downstream outputs -->
  <g filter="url(#shadow)">
    <rect x="56" y="648" width="190" height="36" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="72" y="671" class="chip">Structure prediction</text>

    <rect x="266" y="648" width="190" height="36" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="282" y="671" class="chip">Binding affinity</text>

    <rect x="476" y="648" width="190" height="36" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="492" y="671" class="chip">Antibody design</text>

    <rect x="686" y="648" width="190" height="36" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="702" y="671" class="chip">Enzyme engineering</text>

    <rect x="896" y="648" width="168" height="36" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="912" y="671" class="chip">Function / PPI</text>
  </g>

  <!-- Side legend -->
  <rect x="900" y="56" width="164" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="916" y="78" class="footer">85+ notebooks</text>
  <text x="916" y="96" class="footer">229 reference papers</text>
  <text x="916" y="114" class="footer">50+ fine-tune tasks</text>
</svg>
