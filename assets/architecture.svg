  <text x="290" y="170" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ede9fe">405 named tensors</text>
  <text x="290" y="186" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ede9fe">368.4M parameters</text>
  <text x="290" y="202" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ede9fe">python -m ... check</text>

  <polygon points="486,168 502,160 502,176" fill="#64748b"/>

